# One isolated Top Middle object. Select the HDMI endpoint with --device.
# Same default listener-relative position as the component's Top Middle model.
[engine]
sample_rate=48000
duration_seconds=3
master_gain_db=-18

[custom]
object_count=1

[custom_object.1]
name=top_middle_right
frequency_hz=880
gain_db=-12
x=0.8
y=1.4
z=0
motion=none
