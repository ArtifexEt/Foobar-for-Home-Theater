# First diagnostics profile for Windows Spatial Audio for Home Theater.
# Coordinates are meters relative to the listener:
# x < 0 = left, x > 0 = right
# y > 0 = above, y < 0 = below
# z < 0 = in front, z > 0 = behind

[engine]
sample_rate=48000
duration_seconds=10
channel_test_seconds=1.25
master_gain_db=-18.0

[layout]
# Supported values in these tools: stereo, 5.1, 7.1, 5.1.2, 7.1.4.
static_bed=7.1.4

[channel_gains_db]
front_left=0
front_right=0
front_center=-3
low_frequency=-8
side_left=-2
side_right=-2
back_left=-3
back_right=-3
top_front_left=0
top_front_right=0
top_back_left=0
top_back_right=0

[stereo_upmix]
# Used by StereoSpatialPlayer.exe.
# The first pass is intentionally conservative to avoid harsh rear/height bleed.
input_gain_db=0
front_gain_db=0
center_gain_db=-6
surround_gain_db=-9
rear_gain_db=-12
height_gain_db=-12
height_from_mid=0.20
side_amount=0.75
enable_lfe=false
lfe_gain_db=-24
lfe_lowpass_hz=120

[custom]
# These objects are used by --custom. The first pass is synthetic tones.
# A later foobar DSP/output component will replace tones with extracted stereo stems:
# left, right, mid, side, ambience, height_ambience, lfe.
object_count=4

[custom_object.1]
name=left_front_source
source=left
frequency_hz=330
gain_db=-3
x=-1.2
y=0.1
z=-1.4
motion=none

[custom_object.2]
name=right_front_source
source=right
frequency_hz=440
gain_db=-3
x=1.2
y=0.1
z=-1.4
motion=none

[custom_object.3]
name=left_ceiling_ambience
source=ambience
frequency_hz=660
gain_db=-9
x=-0.8
y=1.5
z=0.3
motion=none

[custom_object.4]
name=right_ceiling_ambience
source=ambience
frequency_hz=770
gain_db=-9
x=0.8
y=1.5
z=0.3
motion=none
