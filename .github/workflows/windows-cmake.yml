name: Windows Spatial Audio Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Spatial Audio
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Build foobar2000 component
        shell: pwsh
        run: |
          $sdkUrl = "https://www.foobar2000.org/downloads/SDK-2025-03-07.7z"
          New-Item -ItemType Directory -Force external | Out-Null
          Invoke-WebRequest -Uri $sdkUrl -OutFile external/foobar2000-sdk.7z
          7z x external/foobar2000-sdk.7z -oexternal/foobar2000-sdk -y
          Copy-Item -Recurse components/foo_out_spatial_audio external/foobar2000-sdk/foobar2000/
          msbuild external/foobar2000-sdk/foobar2000/foo_out_spatial_audio/foo_out_spatial_audio.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/config | Out-Null
          Copy-Item build/Release/SpatialAudioDiagnostics.exe dist/
          Copy-Item build/Release/StereoSpatialPlayer.exe dist/
          Copy-Item config/spatial_audio_profile.ini dist/config/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Foobar-for-Home-Theater-windows-x64.zip -Force
          Compress-Archive -Path external/foobar2000-sdk/foobar2000/foo_out_spatial_audio/bin/x64/Release/foo_out_spatial_audio.dll -DestinationPath foo_out_spatial_audio.fb2k-component -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foobar-for-Home-Theater-windows-x64
          path: |
            Foobar-for-Home-Theater-windows-x64.zip
            foo_out_spatial_audio.fb2k-component

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "Foobar-for-Home-Theater-windows-x64.zip"
          $componentAsset = "foo_out_spatial_audio.fb2k-component"

          $tag = "v0.3.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_RUN_ATTEMPT -and $env:GITHUB_RUN_ATTEMPT -ne "1") {
            $tag = "$tag-r$env:GITHUB_RUN_ATTEMPT"
          }
          $title = "Foobar for Home Theater $tag"

          git fetch --tags --force

          $previousTag = ""
          try {
            $previousTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' 2>$null
          } catch {
            $previousTag = ""
          }
          if ($previousTag -eq "null") {
            $previousTag = ""
          }

          $range = "HEAD"
          $changesHeader = "Changes"
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            git rev-parse "$previousTag^{commit}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $range = "$previousTag..HEAD"
              $changesHeader = "Changes since $previousTag"
            }
          }

          $changes = git log $range --no-merges --pretty=format:"- %s (%h)"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            $changes = "- Build artifacts only."
          }

          @(
            "Automated Windows build from $env:GITHUB_SHA.",
            "",
            "## Downloads",
            "- ``foo_out_spatial_audio.fb2k-component`` - foobar2000 output component",
            "- ``Foobar-for-Home-Theater-windows-x64.zip`` - standalone diagnostics and test tools",
            "",
            "## $changesHeader",
            $changes
          ) | Set-Content -Path release-notes.md -Encoding utf8

          gh release create $tag $asset $componentAsset --title $title --notes-file release-notes.md --target $env:GITHUB_SHA
