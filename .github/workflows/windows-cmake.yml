name: Windows Spatial Audio Build

on:
  push:
    branches:
      - main
      - feature/**
      - codex/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Spatial Audio
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set build version
        shell: pwsh
        run: |
          $version = "0.5.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_RUN_ATTEMPT -and $env:GITHUB_RUN_ATTEMPT -ne "1") {
            $version = "$version-r$env:GITHUB_RUN_ATTEMPT"
          }
          "COMPONENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Component version: $version"
          Write-Host "Release tag: v$version"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke standalone tools
        shell: pwsh
        run: |
          build/Release/SpatialAudioDiagnostics.exe --help
          build/Release/StereoSpatialPlayer.exe --help

      - name: Build foobar2000 components
        shell: pwsh
        run: |
          $sdkUrl = "https://www.foobar2000.org/downloads/SDK-2025-03-07.7z"
          $wtlUrl = "https://www.nuget.org/api/v2/package/wtl/10.1.0"
          New-Item -ItemType Directory -Force external | Out-Null
          Invoke-WebRequest -Uri $sdkUrl -OutFile external/foobar2000-sdk.7z
          Invoke-WebRequest -Uri $wtlUrl -OutFile external/wtl.nupkg
          7z x external/foobar2000-sdk.7z -oexternal/foobar2000-sdk -y
          7z x external/wtl.nupkg -oexternal/wtl -y
          $wtlInclude = (Resolve-Path external/wtl/lib/native/include).Path
          $env:INCLUDE = "$wtlInclude;$env:INCLUDE"
          $env:CL = "/I`"$wtlInclude`" $env:CL"

          # Build output component
          Copy-Item -Recurse components/foo_out_spatial_audio external/foobar2000-sdk/foobar2000/
          @"
          #pragma once

          #define SPATIAL_AUDIO_COMPONENT_VERSION "$env:COMPONENT_VERSION"
          "@ | Set-Content -Path external/foobar2000-sdk/foobar2000/foo_out_spatial_audio/component_version.h -Encoding ascii
          msbuild external/foobar2000-sdk/foobar2000/foo_out_spatial_audio/foo_out_spatial_audio.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build DSP component
          Copy-Item -Recurse components/foo_dsp_spatial external/foobar2000-sdk/foobar2000/
          @"
          #pragma once

          #ifndef SPATIAL_DSP_COMPONENT_VERSION
          #define SPATIAL_DSP_COMPONENT_VERSION "$env:COMPONENT_VERSION"
          #endif
          "@ | Set-Content -Path external/foobar2000-sdk/foobar2000/foo_dsp_spatial/component_version.h -Encoding ascii
          msbuild external/foobar2000-sdk/foobar2000/foo_dsp_spatial/foo_dsp_spatial.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Build chain-friendly height-only DSP component
          Copy-Item -Recurse components/foo_dsp_height external/foobar2000-sdk/foobar2000/
          @"
          #pragma once

          #ifndef HEIGHT_DSP_COMPONENT_VERSION
          #define HEIGHT_DSP_COMPONENT_VERSION "$env:COMPONENT_VERSION"
          #endif
          "@ | Set-Content -Path external/foobar2000-sdk/foobar2000/foo_dsp_height/component_version.h -Encoding ascii
          msbuild external/foobar2000-sdk/foobar2000/foo_dsp_height/foo_dsp_height.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/config | Out-Null
          New-Item -ItemType Directory -Force dist/components | Out-Null
          Copy-Item build/Release/SpatialAudioDiagnostics.exe dist/
          Copy-Item build/Release/StereoSpatialPlayer.exe dist/
          Copy-Item config/spatial_audio_profile.ini dist/config/
          Copy-Item README.md dist/
          @(
            "Examples:",
            "  .\SpatialAudioDiagnostics.exe --list-devices",
            "  .\SpatialAudioDiagnostics.exe --device korytarz --probe --config .\config\spatial_audio_profile.ini",
            "  .\SpatialAudioDiagnostics.exe --device korytarz --static-test --config .\config\spatial_audio_profile.ini",
            "  .\StereoSpatialPlayer.exe --device korytarz --wav C:\path\to\stereo-48k.wav --mode bed --config .\config\spatial_audio_profile.ini"
          ) | Set-Content -Path dist/DIAGNOSTICS.txt -Encoding utf8
          Compress-Archive -Path external/foobar2000-sdk/foobar2000/foo_out_spatial_audio/bin/x64/Release/foo_out_spatial_audio.dll -DestinationPath foo_out_spatial_audio.zip -Force
          Compress-Archive -Path external/foobar2000-sdk/foobar2000/foo_dsp_spatial/bin/x64/Release/foo_dsp_spatial.dll -DestinationPath foo_dsp_spatial.zip -Force
          Compress-Archive -Path external/foobar2000-sdk/foobar2000/foo_dsp_height/bin/x64/Release/foo_dsp_height.dll -DestinationPath foo_dsp_height.zip -Force
          Move-Item foo_out_spatial_audio.zip foo_out_spatial_audio.fb2k-component -Force
          Move-Item foo_dsp_spatial.zip foo_dsp_spatial.fb2k-component -Force
          Move-Item foo_dsp_height.zip foo_dsp_height.fb2k-component -Force
          Copy-Item foo_out_spatial_audio.fb2k-component dist/components/
          Copy-Item foo_dsp_spatial.fb2k-component dist/components/
          Copy-Item foo_dsp_height.fb2k-component dist/components/
          Compress-Archive -Path dist/* -DestinationPath Foobar-for-Home-Theater-windows-x64.zip -Force

      - name: Verify packages
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $components = @(
            @{ Archive = "foo_out_spatial_audio.fb2k-component"; Dll = "foo_out_spatial_audio.dll" },
            @{ Archive = "foo_dsp_spatial.fb2k-component"; Dll = "foo_dsp_spatial.dll" },
            @{ Archive = "foo_dsp_height.fb2k-component"; Dll = "foo_dsp_height.dll" }
          )
          foreach ($component in $components) {
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $component.Archive))
            try {
              $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
              if ($names -notcontains $component.Dll) {
                throw "$($component.Archive) does not contain $($component.Dll) at archive root."
              }
            } finally {
              $archive.Dispose()
            }
          }

          $bundle = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "Foobar-for-Home-Theater-windows-x64.zip"))
          try {
            $bundleNames = @($bundle.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($component in $components) {
              $expected = "components/$($component.Archive)"
              if ($bundleNames -notcontains $expected) {
                throw "Main Windows ZIP does not contain $expected."
              }
            }
          } finally {
            $bundle.Dispose()
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foobar-for-Home-Theater-windows-x64
          path: |
            Foobar-for-Home-Theater-windows-x64.zip
            foo_out_spatial_audio.fb2k-component
            foo_dsp_spatial.fb2k-component
            foo_dsp_height.fb2k-component

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "Foobar-for-Home-Theater-windows-x64.zip"
          $outputAsset = "foo_out_spatial_audio.fb2k-component"
          $dspAsset = "foo_dsp_spatial.fb2k-component"
          $heightDspAsset = "foo_dsp_height.fb2k-component"

          $tag = $env:RELEASE_TAG
          $title = "Foobar for Home Theater $tag"

          git fetch --tags --force

          $previousTag = ""
          try {
            $previousTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' 2>$null
          } catch {
            $previousTag = ""
          }
          if ($previousTag -eq "null") {
            $previousTag = ""
          }
          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            try {
              $previousTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=50" --jq '[.[] | select(.draft == false)][0].tag_name' 2>$null
            } catch {
              $previousTag = ""
            }
            if ($previousTag -eq "null") {
              $previousTag = ""
            }
          }

          $range = "HEAD"
          $changesHeader = "Changes"
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            git rev-parse "$previousTag^{commit}" *> $null
            if ($LASTEXITCODE -eq 0) {
              $range = "$previousTag..HEAD"
              $changesHeader = "Changes since $previousTag"
            }
          }

          $changes = git log $range --no-merges --pretty=format:"- %s (%h)"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            $changes = "- Build artifacts only."
          }

          @(
            "Automated Windows build from $env:GITHUB_SHA.",
            "",
            "Component version: ``$env:COMPONENT_VERSION``.",
            "",
            "## Downloads",
            "- ``foo_dsp_spatial.fb2k-component`` - foobar2000 spatial upmix DSP component",
            "- ``foo_dsp_height.fb2k-component`` - chain-friendly DSP that adds only ceiling speakers",
            "- ``foo_out_spatial_audio.fb2k-component`` - foobar2000 Windows Spatial Audio output component",
            "- ``Foobar-for-Home-Theater-windows-x64.zip`` - all foobar2000 components plus standalone diagnostics and test tools",
            "",
            "## $changesHeader",
            $changes
          ) | Set-Content -Path release-notes.md -Encoding utf8

          gh release create $tag $asset $outputAsset $dspAsset $heightDspAsset --title $title --notes-file release-notes.md --target $env:GITHUB_SHA
